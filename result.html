<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conversion Result — Go Morse Converter</title>

    <style>
        :root {
            color-scheme: dark;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 20px;
            color: #e8edf5;
            background:
                radial-gradient(circle at top, #17325c 0, transparent 42%),
                #08111f;
        }

        .card {
            width: min(100%, 760px);
            padding: 42px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            background: rgba(12, 24, 43, 0.94);
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.38);
        }

        .badge {
            display: inline-block;
            margin-bottom: 18px;
            padding: 7px 11px;
            border: 1px solid rgba(107, 166, 255, 0.35);
            border-radius: 999px;
            color: #9fc4ff;
            background: rgba(56, 117, 210, 0.12);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(32px, 6vw, 48px);
            letter-spacing: -0.04em;
        }

        .description {
            margin: 16px 0 28px;
            color: #aebbd0;
            line-height: 1.6;
        }

        code {
            color: #bcd6ff;
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 10px;
            color: #dce6f5;
            font-size: 14px;
            font-weight: 700;
        }

        pre {
            min-height: 150px;
            max-height: 420px;
            margin: 0;
            padding: 22px;
            overflow: auto;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            border: 1px solid #334b70;
            border-radius: 14px;
            color: #dbe8fa;
            background: #07101d;
            font: 15px/1.7 Consolas, Monaco, monospace;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        button,
        a {
            min-height: 46px;
            padding: 12px 18px;
            border: 0;
            border-radius: 12px;
            font: inherit;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            color: #06101f;
            background: #81b3ff;
        }

        button:hover {
            background: #a3c8ff;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #dce8fa;
            background: #263b5b;
        }

        a:hover {
            background: #324d75;
        }

        @media (max-width: 560px) {
            .card {
                padding: 28px 22px;
                border-radius: 18px;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="badge">Conversion complete</div>

        <h1>Conversion Result</h1>

        <p class="description">
            The converted content was saved as
            <code>{{.Filename}}</code>.
        </p>

        <div class="result-header">
            <span>Converted content</span>
        </div>

        <pre id="result">{{.Result}}</pre>

        <div class="actions">
            <button type="button" onclick="copyResult()">
                Copy result
            </button>

            <a href="/">
                Convert another file
            </a>
        </div>
    </main>

    <script>
        async function copyResult() {
            const result = document.getElementById("result").textContent;
            const button = document.querySelector("button");

            await navigator.clipboard.writeText(result);

            const originalText = button.textContent;
            button.textContent = "Copied";

            setTimeout(() => {
                button.textContent = originalText;
            }, 1500);
        }
    </script>
</body>
</html>
